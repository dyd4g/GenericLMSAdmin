<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Learning Admin — Design preview</title><style>
:root{--ink:#192631;--muted:#62717e;--line:#e3e8ed;--blue:#245bd6;--bg:#f7f9fb}*{box-sizing:border-box}body{margin:0;font:14px/1.5 'Segoe UI',Arial,sans-serif;color:var(--ink);background:var(--bg)}button,input,select{font:inherit}button,a,select{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #8bb4ff;outline-offset:3px}button{background:white;border:1px solid #d5dde5;border-radius:6px;padding:8px 13px;color:var(--ink)}button:hover{background:#f1f5fa}button.primary{background:var(--blue);border-color:var(--blue);color:white}.shell{display:grid;grid-template-columns:222px 1fr;min-height:100vh}aside{background:white;border-right:1px solid var(--line);padding:26px 16px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}.brand{display:flex;gap:10px;align-items:center;font-size:17px;font-weight:650;padding:0 8px 30px}.mark{width:30px;height:30px;background:#245bd6;color:white;display:grid;place-items:center;border-radius:7px;font-weight:700}.sectionlabel{font-size:12px;color:var(--muted);padding:14px 12px 8px}.nav{display:flex;align-items:center;gap:12px;border:0;background:transparent;text-align:left;width:100%;padding:10px 12px;margin:3px 0}.nav.active{color:#1f50bf;background:#edf3ff;font-weight:600}.ico{width:20px;font-size:18px;color:#788896}.sidebottom{margin-top:auto;border-top:1px solid var(--line);padding-top:16px}.avatar{border-radius:50%;background:#eaf0fa;color:#31558d;width:34px;height:34px;display:grid;place-items:center;font-size:12px;font-weight:650}.account{display:flex;gap:10px;padding:12px 6px}.sub{color:var(--muted);font-size:12px}header{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 36px;background:white;border-bottom:1px solid var(--line)}.env{display:flex;align-items:center;gap:8px;font-size:13px}.dot{width:7px;height:7px;background:#238460;border-radius:50%}.preview{color:#62717e;font-size:12px;border-left:1px solid var(--line);padding-left:14px;margin-left:6px}.workspace{font-weight:600}.content{max-width:1450px;margin:auto;padding:28px 36px}.crumb{font-size:12px;color:var(--muted);margin-bottom:23px}.crumb button{padding:0;border:0;background:transparent;color:var(--blue)}.heading{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-bottom:25px}h1{font-size:28px;font-weight:650;letter-spacing:-.7px;margin:0 0 6px}h2{font-size:17px;margin:0 0 18px;font-weight:600}p{margin:0;color:var(--muted)}.actions{display:flex;gap:8px;align-items:center}.tabs{display:flex;gap:24px;border-bottom:1px solid var(--line);margin-bottom:24px;overflow:auto}.tab{border:0;border-radius:0;background:transparent;white-space:nowrap;padding:12px 0;color:var(--muted);border-bottom:2px solid transparent}.tab.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:600}.count{font-size:12px;background:#eef1f5;padding:2px 7px;border-radius:5px;margin-left:6px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:20px 0 16px}.filters{display:flex;gap:10px;flex-wrap:wrap}input,select{border:1px solid #d5dde5;background:white;padding:9px 12px;border-radius:6px;color:var(--ink)}input{width:270px}select{min-width:120px}.tablewrap{background:white;border:1px solid var(--line);border-radius:8px;overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}th{text-align:left;background:#fafbfd;color:var(--muted);font-weight:500;font-size:12px}th,td{padding:17px 18px;border-bottom:1px solid var(--line)}td{font-size:13px}tbody tr:last-child td{border-bottom:0}tbody tr:hover{background:#fafcff}.coursecell{display:flex;gap:12px;align-items:center}.tile{width:38px;height:42px;border-radius:5px;display:grid;place-items:center;font-size:17px;background:#edf3ff;color:#4269ab;flex-shrink:0}.tile.green{background:#eaf5ef;color:#38775a}.tile.gold{background:#fbf2df;color:#97763b}.link{border:0;padding:0;background:none;color:var(--ink);font-weight:600;text-align:left}.link:hover{color:var(--blue);background:none}.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border-radius:5px;font-size:11px;font-weight:600;background:#edf6f0;color:#28724f}.badge.Draft{background:#eef1f5;color:#596979}.badge.Test{background:#fff3dc;color:#865e11}.badge.Archived{background:#f2eef7;color:#72538a}.foot{display:flex;justify-content:space-between;align-items:center;margin-top:17px;color:var(--muted);font-size:12px}.pages{display:flex;gap:5px}.pages button{padding:5px 10px}.pages .selected{color:var(--blue);background:#edf3ff;border-color:#cddcfc}.detailgrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px}.panel{background:white;border:1px solid var(--line);border-radius:8px;padding:24px;margin-bottom:20px}.description{line-height:1.9;max-width:75ch}.dl{display:grid;grid-template-columns:1fr 1fr;gap:22px}.label{font-size:12px;color:var(--muted);margin-bottom:5px}.value{font-weight:500}.setting{display:flex;justify-content:space-between;gap:20px;padding:13px 0;border-bottom:1px solid var(--line)}.setting:last-child{border:0}.yes{color:#28724f;font-size:12px}.lesson{padding:17px 0;border-bottom:1px solid var(--line);display:flex;gap:15px;align-items:center}.lesson:last-child{border:0}.num{border:1px solid var(--line);border-radius:5px;padding:5px 10px;color:var(--muted)}.notice{font-size:12px;color:var(--muted);margin-top:26px}.groupgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.groupcard{background:white;border:1px solid var(--line);border-radius:8px;padding:24px;text-align:left}.groupcard h2{margin:16px 0 5px}.groupcard .tile{width:44px;height:44px}.groupcard p{white-space:normal;min-height:45px}.groupmeta{border-top:1px solid var(--line);margin-top:20px;padding-top:15px;display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}dialog{border:1px solid var(--line);border-radius:10px;padding:28px;width:min(540px,90vw);box-shadow:0 20px 80px #16233830}dialog::backdrop{background:#19263155}dialog h2{margin-bottom:12px}dialog p{margin-bottom:24px}.mobilemenu{display:none}.screen{min-height:580px}@media(max-width:1100px){.groupgrid{grid-template-columns:1fr 1fr}.detailgrid{grid-template-columns:1fr}.shell{grid-template-columns:190px 1fr}.content{padding:24px}.filters input{width:200px}}@media(max-width:760px){.shell{display:block}aside{display:none;height:auto;position:relative}.shell.menu aside{display:flex}.mobilemenu{display:block}header{padding:0 18px}.content{padding:22px 16px}.heading,.toolbar{align-items:flex-start;flex-direction:column}.groupgrid{grid-template-columns:1fr}.preview{display:none}.dl{grid-template-columns:1fr}.actions{flex-wrap:wrap}.foot{gap:15px}.env select{min-width:0;width:95px}.workspace{display:none}}
</style></head><body><div class="shell" id="shell"><aside><div class="brand"><span class="mark">L</span>Learning Admin</div><div class="sectionlabel">Workspace</div><nav id="nav"></nav><div class="sidebottom"><div class="sub" style="padding:0 8px">Design preview · Sample data</div><div class="account"><div class="avatar">SA</div><div><strong style="font-size:12px">Super administrator</strong><div class="sub">Full access preview</div></div></div></div></aside><div><header><button class="mobilemenu" onclick="document.getElementById('shell').classList.toggle('menu')" aria-label="Toggle navigation">☰</button><span class="workspace">Administration workspace</span><div class="env"><span class="dot"></span><select aria-label="Preview environment" id="environment"><option>RSTI</option><option>Galilee One</option><option>HP LIFE</option></select><span class="preview">Local design preview</span></div></header><main class="content screen" id="main"></main></div></div><dialog id="dialog"><h2 id="dialogtitle"></h2><p id="dialogtext"></p><button onclick="document.getElementById('dialog').close()">Close</button></dialog><script>
const courses=[['Workplace safety essentials','Safety & compliance','Published','Self-paced',128,'Oct 23, 2026'],['Introduction to technical training','Technical skills','Published','Coach-assisted',64,'Oct 21, 2026'],['Equipment maintenance fundamentals','Technical skills','Draft','Coach-assisted',0,'Oct 20, 2026'],['Communication at work','Professional skills','Test','Self-paced',12,'Oct 18, 2026'],['Quality assurance foundations','Operations','Published','Self-paced',86,'Oct 16, 2026'],['Customer service fundamentals','Professional skills','Archived','Self-paced',42,'Oct 12, 2026']];let page='Courses',selected=0,tab='Overview',group='Training and development';const main=document.getElementById('main');const navs=[['Groups','▦'],['Courses','▤'],['Users','♙'],['Books','▥'],['Certifications','◇'],['Referrals','↗'],['System alerts','⚑']];function nav(){document.getElementById('nav').innerHTML=navs.map(([n,i])=>`<button class="nav ${page===n||page==='Detail'&&n==='Courses'?'active':''}" onclick="navigate('${n}')"><span class="ico" aria-hidden="true">${i}</span>${n}</button>`).join('')}function navigate(n){page=n;nav();render()}function info(title){document.getElementById('dialogtitle').textContent=title;document.getElementById('dialogtext').textContent='This is a design preview. This action will be connected to the existing workflow in the new admin app. No data has been changed.';document.getElementById('dialog').showModal()}function openCourse(i){selected=i;page='Detail';tab='Overview';nav();render()}function badge(s){return `<span class="badge ${s}">${s}</span>`}function render(){if(page==='Courses')list();else if(page==='Groups')groups();else if(page==='Detail')detail();else placeholder()}
function list(){main.innerHTML=`<div class="crumb">Workspace / Courses</div><div class="heading"><div><h1>Courses</h1><p>Manage learning content and course access.</p></div><button class="primary" onclick="info('Create course')">+ Create course</button></div><div class="tabs"><button class="tab active">All courses <span class="count">6</span></button></div><div class="toolbar"><div class="filters"><input id="search" aria-label="Search courses" placeholder="Search courses…" oninput="rows()"><select id="status" aria-label="Filter status" onchange="rows()"><option>All statuses</option><option>Published</option><option>Draft</option><option>Test</option><option>Archived</option></select><select id="type" aria-label="Filter course type" onchange="rows()"><option>All types</option><option>Self-paced</option><option>Coach-assisted</option></select></div><button onclick="document.getElementById('search').value='';document.getElementById('status').selectedIndex=0;document.getElementById('type').selectedIndex=0;rows()">Reset filters</button></div><div class="tablewrap"><table><thead><tr><th>Course name</th><th>Status</th><th>Type</th><th>Participants</th><th>Updated</th><th><span aria-label="Actions">Actions</span></th></tr></thead><tbody id="rows"></tbody></table></div><div class="foot"><span id="results"></span><div class="pages"><button disabled aria-label="Previous page">‹</button><button class="selected" aria-current="page">1</button><button disabled aria-label="Next page">›</button></div></div><div class="notice">Sample records for layout review. Environment selection changes the preview label only.</div>`;rows()}
function rows(){const q=document.getElementById('search').value.toLowerCase(),s=document.getElementById('status').value,t=document.getElementById('type').value;let matches=courses.map((c,i)=>({c,i})).filter(({c})=>c[0].toLowerCase().includes(q)&&(s==='All statuses'||c[2]===s)&&(t==='All types'||c[3]===t));document.getElementById('rows').innerHTML=matches.map(({c,i})=>`<tr><td><div class="coursecell"><div class="tile ${i%3===1?'green':i%3===2?'gold':''}" aria-hidden="true">▤</div><div><button class="link" onclick="openCourse(${i})">${c[0]}</button><div class="sub">${c[1]}</div></div></div></td><td>${badge(c[2])}</td><td>${c[3]}</td><td>${c[4]}</td><td>${c[5]}</td><td><button onclick="openCourse(${i})">View course</button></td></tr>`).join('')||'<tr><td colspan="6">No matching courses. Try a different search or reset the filters.</td></tr>';document.getElementById('results').textContent=`${matches.length} of 6 courses`}
function detail(){let c=courses[selected];main.innerHTML=`<div class="crumb"><button onclick="navigate('Courses')">Courses</button> / ${c[0]}</div><div class="heading"><div><div style="display:flex;gap:12px;align-items:center;margin-bottom:8px"><h1 style="margin:0">${c[0]}</h1>${badge(c[2])}</div><p>${c[3]} course · ${group}</p></div><div class="actions"><button onclick="info('Preview course')">Preview</button><button class="primary" onclick="info('Edit course')">Edit course</button></div></div><div class="tabs">${['Overview','Lessons','Participants',...(c[3]==='Coach-assisted'?['Coaches','Prerequisites']:[]),'Books','Keys',...(c[3]==='Coach-assisted'?['Coach keys']:[])].map(t=>`<button class="tab ${tab===t?'active':''}" onclick="tab='${t}';detail()">${t}</button>`).join('')}</div><div id="detailbody"></div>`;document.getElementById('detailbody').innerHTML=tab==='Overview'?`<div class="detailgrid"><div><section class="panel"><h2>About this course</h2><p class="description">Build the knowledge and practical skills needed for a safer, more effective workplace. This course combines focused learning activities with practical examples and knowledge checks.</p><hr style="border:0;border-top:1px solid var(--line);margin:24px 0"><div class="dl"><div><div class="label">Category</div><div class="value">${c[1]}</div></div><div><div class="label">Language</div><div class="value">English</div></div><div><div class="label">Course code</div><div class="value">CRS-${String(selected+1).padStart(3,'0')}</div></div><div><div class="label">Visibility</div><div class="value">Public</div></div></div></section><section class="panel"><div style="display:flex;justify-content:space-between"><h2>Course content</h2><button class="link" style="color:var(--blue)" onclick="tab='Lessons';detail()">View lessons</button></div>${['Getting started','Core concepts','Putting it into practice'].map((l,i)=>`<div class="lesson"><span class="num">${i+1}</span><div><strong>${l}</strong><div class="sub">${i+2} learning activities</div></div></div>`).join('')}</section></div><div><section class="panel"><h2>Course settings</h2>${[['Enrollment approval','Not required'],['Group membership','Not required'],['Completion certificate','Enabled'],['Sequential learning','Enabled']].map(([k,v])=>`<div class="setting"><span class="sub">${k}</span><span style="font-size:12px">${v}</span></div>`).join('')}</section><section class="panel"><h2>Participation</h2><div style="font-size:30px;font-weight:600">${c[4]}</div><p class="sub">Enrolled participants</p><button style="margin-top:18px;width:100%" onclick="tab='Participants';detail()">Manage participants</button></section></div></div>`:tab==='Lessons'?`<section class="panel"><div class="heading"><h2>Lessons</h2><button class="primary" onclick="info('Add lesson')">+ Add lesson</button></div>${['Getting started','Core concepts','Putting it into practice'].map((l,i)=>`<div class="lesson"><span class="num">${i+1}</span><div style="flex:1"><strong>${l}</strong><div class="sub">Content · Video · Knowledge check</div></div><button onclick="info('Edit lesson')">Edit lesson</button></div>`).join('')}</section>`:tab==='Participants'?`<section class="panel"><div class="heading"><h2>Participants</h2><button class="primary" onclick="info('Add participants')">+ Add participants</button></div><div class="tablewrap"><table><thead><tr><th>Name</th><th>Enrollment</th><th>Progress</th></tr></thead><tbody>${['Alex Morgan','Jordan Lee','Sam Taylor'].map((n,i)=>`<tr><td>${n}<div class="sub">Sample participant</div></td><td>${badge('Published').replace('Published','Enrolled')}</td><td>${[75,40,100][i]}%</td></tr>`).join('')}</tbody></table></div></section>`:`<section class="panel"><h2>${tab}</h2><p>This section will retain the current ${tab.toLowerCase()} workflow.</p><button style="margin-top:20px" onclick="info('Manage ${tab.toLowerCase()}')">Manage ${tab.toLowerCase()}</button></section>`}
function groups(){main.innerHTML=`<div class="crumb">Workspace / Groups</div><div class="heading"><div><h1>Groups</h1><p>Manage organizations and their learning content.</p></div><button class="primary" onclick="info('Create group')">+ Create group</button></div><div class="groupgrid">${[['Training and development','Workplace learning and professional development.',6,332],['Technical education','Practical skills and specialist training.',12,186],['Community learning','Accessible learning for every participant.',8,245]].map(([n,d,c,u],i)=>`<button class="groupcard" onclick="group='${n}';navigate('Courses')"><div class="tile ${i===1?'green':'gold'}">▦</div><h2>${n}</h2><p>${d}</p><div class="groupmeta"><span>${c} courses</span><span>${u} members</span></div></button>`).join('')}</div><div class="notice">Sample groups. Select a group to explore the course layout.</div>`}
function placeholder(){main.innerHTML=`<div class="crumb">Workspace / ${page}</div><div class="heading"><div><h1>${page}</h1><p>Manage ${page.toLowerCase()} in your learning environment.</p></div></div><section class="panel"><h2>${page} workspace</h2><p>This first preview focuses on groups, course lists and course details. The remaining screens will follow the same layout and preserve their existing features.</p><button style="margin-top:20px" onclick="navigate('Courses')">Explore course design</button></section>`}nav();render();
</script></body></html>
